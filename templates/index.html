<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Chatbot</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#F0FDFA;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.container{
width:95%;
max-width:1200px;
height:90vh;
margin:auto;
background:white;
border-radius:18px;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.header{
background:linear-gradient(135deg,#14B8A6,#0F766E);
color:white;
padding:18px 25px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h2{
font-size:28px;
font-weight:700;
}

.header p{
font-size:14px;
opacity:.9;
margin-top:3px;
}

.status{
display:flex;
align-items:center;
gap:8px;
font-size:14px;
}

.dot{
width:10px;
height:10px;
background:#22c55e;
border-radius:50%;

}

#chatbox{
flex:1;
overflow-y:auto;
padding:25px;
background:#f8fafc;
display:flex;
flex-direction:column;
}

.message{
padding:15px 18px;
margin-bottom:18px;
max-width:75%;
line-height:1.7;
border-radius:18px;
animation:fade .3s ease;
word-break:break-word;
}

.bot{
align-self:flex-start;
background:white;
border:1px solid #ccfbf1;
border-bottom-left-radius:5px;
box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.user{
align-self:flex-end;
background:#14B8A6;
color:white;
border-bottom-right-radius:5px;
}


input:focus{

border-color:#14B8A6;

box-shadow:0 0 0 3px rgba(20, 184, 166, .2);

}


.input-area{
    display:flex;
    align-items:center;
    gap:10px;
    padding:15px;
    background:white;
    border-top:1px solid #ddd;
    width:100%;
}

.input-area input{
    flex:1;
    min-width:0;
    padding:15px 18px;
    border-radius:30px;
    border:1px solid #cbd5e1;
    font-size:16px;
    outline:none;
}

.input-area button{
    flex-shrink:0;
    padding:15px 22px;
    background:#14B8A6;
    color:white;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
}
button:hover{

background:#0F766E;

}

.disclaimer{

padding:12px;

background:#f8fafc;

text-align:center;

font-size:13px;

color:#6b7280;

border-top:1px solid #eee;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(10px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@media (max-width:768px){

    body{
        padding:0;
    }

    .container{
        width:100%;
        height:100vh;
        border-radius:0;
    }

    #chatbox{
        padding:15px;
    }

    .message{
        max-width:90%;
    }

    .header{
        padding:16px;
    }

    .header h2{
        font-size:22px;
    }

    .input-area{
        padding:12px;
        gap:8px;
    }

    .input-area button{
        padding:14px 18px;
        font-size:15px;
    }
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div>

<h2>🩺 Medical Chatbot</h2>

<p>Your AI Health Assistant</p>

</div>

<div class="status">

<div class="dot"></div>

Online

</div>

</div>

<div id="chatbox">

<div class="message bot">

<strong>Medical AI</strong>

<br><br>

Hello 

I'm your AI medical assistant.

Describe your symptoms and I'll help you understand possible causes and precautions.

</div>
</div>

<div class="input-area">

<input
type="text"
id="message"
placeholder="Type your symptoms...">

<button onclick="sendMessage()">
Send
</button>

</div>

<div class="disclaimer">
Disclaimer: For informational purposes only. Not a substitute for professional medical advice.
</div>

</div>

<script>

async function sendMessage(){

    let messageInput=document.getElementById("message");

    let message=messageInput.value.trim();

    if(message==="") return;

    let chatbox=document.getElementById("chatbox");

    // User Message

    chatbox.innerHTML+=`

    <div class="message user">

    <strong>You</strong>

    <br><br>

    ${message}

    </div>

    `;

    messageInput.value="";

    chatbox.scrollTop=chatbox.scrollHeight;

    // Typing Message

    let typing=document.createElement("div");

    typing.className="message bot";

    typing.id="typing";

    typing.innerHTML="<strong>Medical AI</strong><br><br><em>Typing...</em>";

    chatbox.appendChild(typing);

    chatbox.scrollTop=chatbox.scrollHeight;

    try{

        let response=await fetch("/chat",{

            method:"POST",

            headers:{

                "Content-Type":"application/json"

            },

            body:JSON.stringify({

                message:message

            })

        });

        let data=await response.json();

        document.getElementById("typing").remove();

        let formattedReply=data.reply

        .replace(/\n\n/g,"<br><br>")

        .replace(/\n/g,"<br>");

        chatbox.innerHTML+=`

        <div class="message bot">

        <strong>Medical AI</strong>

        <br><br>

        ${formattedReply}

        </div>

        `;

        chatbox.scrollTop=chatbox.scrollHeight;

    }

    catch(error){

        document.getElementById("typing").remove();

        chatbox.innerHTML+=`

        <div class="message bot">

        <strong>Medical AI</strong>

        <br><br>

        Sorry, something went wrong.

        </div>

        `;

    }

}

document.getElementById("message").addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        e.preventDefault();

        sendMessage();

    }

});

</script>

</body>

</html>
